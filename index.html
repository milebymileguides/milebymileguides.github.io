<style>
:root{--paper:#FBF8F2;--ink:#1F2933;--quiet:#4B5563;--route:#C2410C;--rule:#D9CFBF}

body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}

a.card{display:block;border-top:4px solid var(--route);padding:18px 0;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}

a.card span{display:block;color:var(--quiet)}
</style>
</head>
